<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Productivity Dashboard</title>
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <link rel="shortcut icon" href="./fav-icon.png" type="image/x-icon" />
  </head>
  <body>
    <div class="dashboard-container">
      <!-- Header Section-->
      <header class="header">
        <h2>Dashboard</h2>
        <!-- Theme Change Button -->
        <button class="theme-toggle-btn" id="theme-btn">
          <i class="ri-moon-line" id="theme-icon"></i>
        </button>
      </header>

      <!-- Dashboard main grid-->
      <main class="dashboard-grid">
        <div class="widget greeting-widget">
          <div class="time-container">
            <h1 id="current-time">00:00</h1>
            <span id="am-pm">AM</span>
          </div>
          <h3 id="greeting-message">Good Morning!</h3>
          <p id="current-date">Loading date...</p>
        </div>

        <!-- To-Do List -->
        <div class="widget todo-widget">
          <h3>My Tasks</h3>

          <!-- Input and Button -->
          <div class="todo-input-container">
            <input
              type="text"
              id="task-input"
              placeholder="Add a new task..."
            />
            <button id="add-task-btn"><i class="ri-add-line"></i></button>
          </div>

          <!-- Task List Container-->
          <ul id="task-list" class="task-list">
            
          </ul>

        </div>

        <!-- Focus Timer -->
            <div class="widget timer-widget">
                <h3>Focus Timer</h3>
                
                <div class="timer-display" id="time-display">25:00</div>
                
                <div class="timer-controls">
                    <button id="start-timer" class="btn btn-primary">Start</button>
                    <button id="pause-timer" class="btn btn-secondary">Pause</button>
                    <button id="reset-timer" class="btn btn-danger">Reset</button>
                </div>
            </div>
            <!-- Quick Notes -->
            <div class="widget notes-widget">
                <h3>Quick Notes</h3>
                <textarea id="quick-notes" placeholder="Write your thoughts here... Auto-saved!"></textarea>
            </div>

            <!-- Main Focus (3D Flip Card) -->
            <div class="widget focus-widget">
                <h3>Main Focus of Today</h3>
                
                <!-- 3D Flip Container-->
                <div class="flip-container" id="focus-container">
                    <div class="flipper" id="focus-flipper">
                        
                        <!-- Front Side  -->
                        <div class="front">
                            <input type="text" id="focus-input" placeholder="What is your main focus today?">
                        </div>
                        
                        <!-- Back Side (Focus Display) -->
                        <div class="back">
                            <div class="focus-display-content" id="focus-display-content">
                                <i class="ri-checkbox-blank-circle-line" id="focus-check"></i>
                                <span id="focus-text"></span>
                                <button id="focus-delete"><i class="ri-close-line"></i></button>
                            </div>
                        </div>
                        
                    </div>
                </div>
            </div>
            <!-- Daily Quote-->
            <div class="widget quote-widget">
                <h3>Daily Inspiration</h3>
                <div class="quote-content">
                    <p id="quote-text">"Loading quote..."</p>
                    <span id="quote-author"></span>
                </div>
                <button id="new-quote-btn"><i class="ri-refresh-line"></i> New Quote</button>
            </div>
      </main>
    </div>
    <script src="script.js"></script>
  </body>
</html>
